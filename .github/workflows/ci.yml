name: CI

on:
  push:
    branches: [master]
  pull_request:

# Dummy Supabase env so the app builds and the server boots without secrets.
# Public routes fall back to the template default; auth calls fail closed
# (unauthenticated) — exactly what the smoke test asserts.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

jobs:
  verify:
    runs-on: ubuntu-latest
    # Disposable Postgres for the DB-level RLS isolation test.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # supabase-js requires Node 22+
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests (unit + DB-level RLS isolation)
        run: npm run test
        env:
          # Enables tests/db/rls.integration.test.ts against the service Postgres.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      - name: Build
        run: npm run build

      - name: End-to-end smoke test
        run: |
          npm run start &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          npm run smoke
        env:
          BASE_URL: http://localhost:3000

      - name: Stop server
        if: always()
        run: kill "$SERVER_PID" 2>/dev/null || true
